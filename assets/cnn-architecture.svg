<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700">
  <defs>
    <style>
      .box { fill:#eef5ff; stroke:#285a9f; stroke-width:2; rx:12; }
      .mem { fill:#f4ecff; stroke:#7042a3; stroke-width:2; rx:12; }
      .compute { fill:#eaf8ef; stroke:#26804a; stroke-width:2; rx:12; }
      .ctrl { fill:#fff4dc; stroke:#aa6c00; stroke-width:2; rx:12; }
      .title { font:700 25px Arial,sans-serif; fill:#172235; }
      .label { font:600 17px Arial,sans-serif; fill:#172235; text-anchor:middle; }
      .small { font:14px Arial,sans-serif; fill:#334155; text-anchor:middle; }
      .arrow { stroke:#334155; stroke-width:2.5; fill:none; marker-end:url(#m); }
      .dash { stroke:#596579; stroke-width:2; fill:none; stroke-dasharray:7 6; marker-end:url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1240" height="700" fill="#ffffff"/>
  <text x="620" y="38" class="title" text-anchor="middle">INT8 CNN — AXI-Lite + SGB MUX20 + Adaptive Ping-Pong</text>

  <rect x="35" y="90" width="190" height="115" class="box"/>
  <text x="130" y="130" class="label">ARM Linux / PS</text>
  <text x="130" y="158" class="small">C evaluator</text>
  <text x="130" y="181" class="small">GAP + Dense</text>

  <rect x="285" y="90" width="185" height="115" class="box"/>
  <text x="377" y="128" class="label">AXI4-Lite Slave</text>
  <text x="377" y="157" class="small">CONTROL / TX / STATUS</text>
  <text x="377" y="180" class="small">RX @ 0xA0000000</text>

  <rect x="535" y="80" width="200" height="135" class="ctrl"/>
  <text x="635" y="121" class="label">Controller</text>
  <text x="635" y="150" class="small">42 context FSM</text>
  <text x="635" y="174" class="small">ready/done/error</text>
  <text x="635" y="197" class="small">adaptive scheduling</text>

  <rect x="800" y="70" width="190" height="155" class="mem"/>
  <text x="895" y="109" class="label">Parameter RAM</text>
  <text x="895" y="138" class="small">42 context + quant</text>
  <text x="895" y="162" class="small">6.096 weight INT8</text>
  <text x="895" y="186" class="small">196 bias</text>

  <rect x="275" y="315" width="220" height="175" class="mem"/>
  <text x="385" y="354" class="label">Local Data Memory</text>
  <text x="385" y="384" class="small">4 groups × 64 rows</text>
  <text x="385" y="408" class="small">20 INT8 lane / row</text>
  <text x="385" y="445" class="small">source / skip / destination</text>

  <rect x="555" y="302" width="210" height="200" class="compute"/>
  <text x="660" y="340" class="label">Feature Engine</text>
  <text x="660" y="370" class="small">Bank A prefetch</text>
  <text x="660" y="394" class="small">Bank B prefetch</text>
  <text x="660" y="430" class="small">A tính ↔ B nạp</text>
  <text x="660" y="454" class="small">đổi vai theo block</text>

  <rect x="825" y="315" width="190" height="175" class="compute"/>
  <text x="920" y="354" class="label">SGB MUX20</text>
  <text x="920" y="384" class="small">shared barrel rotation</text>
  <text x="920" y="408" class="small">20 output lane</text>
  <text x="920" y="445" class="small">chọn tap theo j/pad/stride</text>

  <rect x="1060" y="315" width="150" height="175" class="compute"/>
  <text x="1135" y="354" class="label">20 ALU</text>
  <text x="1135" y="384" class="small">MAC / ADD</text>
  <text x="1135" y="408" class="small">MaxPool</text>
  <text x="1135" y="432" class="small">Requant + SAT8</text>

  <path d="M225 147 L285 147" class="arrow"/>
  <path d="M470 147 L535 147" class="arrow"/>
  <path d="M735 147 L800 147" class="arrow"/>
  <path d="M635 215 L635 302" class="dash"/>
  <path d="M385 315 L385 252 L895 252 L895 225" class="dash"/>
  <path d="M495 402 L555 402" class="arrow"/>
  <path d="M765 402 L825 402" class="arrow"/>
  <path d="M1015 402 L1060 402" class="arrow"/>
  <path d="M1135 490 L1135 555 L385 555 L385 490" class="arrow"/>
  <path d="M285 177 L255 177 L255 580 L130 580 L130 205" class="dash"/>

  <text x="690" y="535" class="small">kết quả INT8 ghi lại LDM</text>
  <text x="620" y="640" class="small">Readback 32 × 40 → PS giải lượng tử → GAP → Dense 5 lớp → prediction/accuracy</text>
</svg>
